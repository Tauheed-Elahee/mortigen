<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Netlify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .netlify-logo {
            width: 120px;
            height: auto;
            margin-bottom: 1rem;
            filter: brightness(0) invert(1);
            opacity: 0.8;
        }
        
        .deploy-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 2rem;
            font-size: 0.9rem;
            border-left: 4px solid #00c7b7;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="netlify-logo" viewBox="0 0 147 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M35.6 18.4c0-1.2-.4-2.3-1.1-3.1-.7-.8-1.7-1.2-2.8-1.2s-2.1.4-2.8 1.2c-.7.8-1.1 1.9-1.1 3.1s.4 2.3 1.1 3.1c.7.8 1.7 1.2 2.8 1.2s2.1-.4 2.8-1.2c.7-.8 1.1-1.9 1.1-3.1zm-1.6 0c0 .8-.2 1.5-.7 2-.5.5-1.1.8-1.8.8s-1.3-.3-1.8-.8c-.5-.5-.7-1.2-.7-2s.2-1.5.7-2c.5-.5 1.1-.8 1.8-.8s1.3.3 1.8.8c.5.5.7 1.2.7 2z" fill="currentColor"/>
            <path d="M147 18.4c0-1.2-.4-2.3-1.1-3.1-.7-.8-1.7-1.2-2.8-1.2s-2.1.4-2.8 1.2c-.7.8-1.1 1.9-1.1 3.1s.4 2.3 1.1 3.1c.7.8 1.7 1.2 2.8 1.2s2.1-.4 2.8-1.2c.7-.8 1.1-1.9 1.1-3.1zm-1.6 0c0 .8-.2 1.5-.7 2-.5.5-1.1.8-1.8.8s-1.3-.3-1.8-.8c-.5-.5-.7-1.2-.7-2s.2-1.5.7-2c.5-.5 1.1-.8 1.8-.8s1.3.3 1.8.8c.5.5.7 1.2.7 2z" fill="currentColor"/>
        </svg>
        
        <h1>Hello World!</h1>
        
        <p>Welcome to your new website hosted on Netlify. This simple page demonstrates a clean, modern design that's ready for deployment.</p>
        
        <div class="deploy-info">
            <strong>🚀 Ready for Netlify!</strong><br>
            This static site is optimized for Netlify's global CDN and will deploy instantly.
        </div>
    </div>
</body>
</html>
